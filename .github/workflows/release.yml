name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # sbt-dynver derives the version from the git tag, so it needs the full history
          fetch-depth: 0

      - name: Setup java
        uses: actions/setup-java@v6
        with:
          # sbt 2 needs Java 17 or newer; the build targets Java 11 with --release 11
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      # With sbt 2 the plain `sbt` command starts a background server that later `sbt` commands reuse.
      # A server started by the Test step does not have the secrets below, so ci-release would
      # silently do nothing. `--server --no-server` runs sbt in the foreground without such a server.
      - name: Test
        run: sbt --server --no-server -batch +testFull

      - name: Publish to Maven Central
        run: |
          set -euo pipefail
          sbt --server --no-server -batch ci-release 2>&1 | tee "$RUNNER_TEMP/ci-release.log"
          # ci-release exits successfully when it cannot see the secrets, so check for that explicitly
          if grep -q "doing nothing" "$RUNNER_TEMP/ci-release.log"; then
            echo "::error::sbt ci-release did nothing, nothing was published"
            exit 1
          fi
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
