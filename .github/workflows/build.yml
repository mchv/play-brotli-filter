name: build
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    name: Build
    strategy:
      matrix:
        os: [macos-14, macos-latest, ubuntu-latest, windows-latest]
        java: [ '17', '21' ]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'sbt'

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - name: Set local hostname
        if: runner.os == 'macOS'
        run: |
          sudo scutil --set HostName $(scutil --get LocalHostName)

      - name: Build
        run: |
          ./scripts/build.sh
        shell: bash

