name: bench
# Measures two commits on the same runner, one after the other: the JMH FilterBench and the load test of bench/README.md.
# The runner is shared and noisy, so compare the two commits with each other, and each brotli row with the gzip row of
# its own run, not with figures from another machine.
on:
  workflow_dispatch:
    inputs:
      base:
        description: "The commit, branch or tag to compare with"
        required: true
        default: "main"
      head:
        description: "The commit, branch or tag to measure"
        required: true
        default: "main"
      base_codecs:
        description: "FilterBench codecs of the base (see bench.FilterBench)"
        default: "none,gzip,br4,br5"
      head_codecs:
        description: "FilterBench codecs of the head"
        default: "none,gzip,br4,br5,br"
      base_filters:
        description: "Load test filters of the base (see bench.LoadTest)"
        default: "gzip,br"
      head_filters:
        description: "Load test filters of the head"
        default: "gzip,brq5,br"
      series:
        description: "Load test series per commit, alternating between the two commits"
        default: "3"
      seconds:
        description: "Seconds measured per load test run, after 3 seconds of warm-up"
        default: "6"

jobs:
  bench:
    name: Bench
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout base
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base }}
          path: base
          show-progress: false

      - name: Checkout head
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head }}
          path: head
          show-progress: false

      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - name: Machine
        run: |
          echo "## Machine" >> "$GITHUB_STEP_SUMMARY"
          { nproc; grep -m1 'model name' /proc/cpuinfo; free -g | head -2; } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "base: $(git -C base rev-parse --short HEAD) ${{ inputs.base }}, head: $(git -C head rev-parse --short HEAD) ${{ inputs.head }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compile
        run: |
          (cd base && sbt -batch "bench/compile")
          (cd head && sbt -batch "bench/compile")

      - name: FilterBench
        run: |
          bodies=strict4k,strict140k,streamed140k,chunked140k,chunkedTiny140k
          (cd base && sbt -batch "bench/Jmh/run -p codec=${{ inputs.base_codecs }} -p body=$bodies bench.FilterBench") 2>&1 | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' | tee base-filterbench.log
          (cd head && sbt -batch "bench/Jmh/run -p codec=${{ inputs.head_codecs }} -p body=$bodies bench.FilterBench") 2>&1 | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' | tee head-filterbench.log
          for which in base head; do
            echo "## FilterBench $which (us/op)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E '^FilterBench|^Benchmark ' "$which-filterbench.log" >> "$GITHUB_STEP_SUMMARY"
            grep -h 'SIZE codec' "$which-filterbench.log" | sed 's/.*SIZE/SIZE/' | sort -u >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Load test
        run: |
          for ((serie = 1; serie <= ${{ inputs.series }}; serie++)); do
            (cd base && bench/load-test.sh 16 3 ${{ inputs.seconds }} 10 1 ${{ inputs.base_filters }}) | tee -a base-load.log
            (cd head && bench/load-test.sh 16 3 ${{ inputs.seconds }} 10 1 ${{ inputs.head_filters }}) | tee -a head-load.log
          done
          for which in base head; do
            echo "## Load test $which (medians of ${{ inputs.series }} series)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            "$which/bench/load-summary.sh" "$which-load.log" | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-logs
          path: |
            *-filterbench.log
            *-load.log
